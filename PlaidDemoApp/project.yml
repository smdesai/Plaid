name: PlaidDemoApp

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

# Settings shared by every target. Target-specific values (bundle id, display
# name, deployment target, Info.plist) live on the individual targets below.
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: TA92TEWDS4
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"
    SWIFT_VERSION: "5.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_PREVIEWS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    LD_RUNPATH_SEARCH_PATHS:
      - $(inherited)
      - "@executable_path/Frameworks"
    # Info.plist keys both apps share (fed to the Xcode plist generator).
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

packages:
  Plaid:
    path: ..
  objectbox-swift-spm:
    url: https://github.com/objectbox/objectbox-swift-spm.git
    majorVersion: 5.3.0

targets:
  PlaidDemoApp:
    type: application
    platform: iOS
    deploymentTarget: "18.6"
    sources:
      - path: PlaidDemoApp
        # INFOPLIST_FILE is a partial plist merged by the Xcode generator; it
        # must not be copied as a bundle resource.
        excludes:
          - Info.plist
      - path: generated
    dependencies:
      - package: Plaid
        product: Plaid
      - package: objectbox-swift-spm
        product: ObjectBox.xcframework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sdesai.PlaidDemoApp2
        INFOPLIST_FILE: PlaidDemoApp/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "Plaid Search"
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Literal embedded quotes protect the space when Xcode word-splits *_PATHS.
        DEVELOPMENT_ASSET_PATHS: '"PlaidDemoApp/Preview Content"'

  ToolSelection:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ToolSelection
    dependencies:
      - package: Plaid
        product: Plaid
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sdesai.ToolSelection
        INFOPLIST_KEY_CFBundleDisplayName: "Tool Selection"

schemes:
  PlaidDemoApp:
    build:
      targets:
        PlaidDemoApp: all
    run:
      config: Release
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  ToolSelection:
    build:
      targets:
        ToolSelection: all
    run:
      config: Release
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
